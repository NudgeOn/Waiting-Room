      },
      "csrfHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      },
      "challengeToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Scoped one-time challenge; five-minute TTL"
      },
      "bootstrapToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Bootstrap-Token",
        "description": "Loopback installation only. Permanently disabled after bootstrap."
      }
    },
    "schemas": {
      "RouteCheckInput": {
        "type": "object", "additionalProperties": false, "required": ["source", "url"],
        "properties": {"source": {"enum": ["draft", "published"]}, "url": {"type": "string", "minLength": 1, "maxLength": 4096}}
      },
      "RouteCheckResult": {
        "type": "object", "additionalProperties": false, "required": ["source", "scope", "revision", "generation", "match"],
        "properties": {
          "source": {"enum": ["draft", "published"]}, "scope": {"const": "configuration-only"},
          "revision": {"type": "integer", "minimum": 0}, "generation": {"type": "integer", "minimum": 0},
          "mode": {"enum": ["OFF", "HOLD", "AUTO", "DRAINING"]},
          "match": {"type": "object", "additionalProperties": false, "required": ["decision", "reason"], "properties": {
            "decision": {"enum": ["protected", "excluded", "unprotected", "reserved", "invalid"]},
            "reason": {"enum": ["protect_prefix", "exclude_prefix", "no_active_rule", "internal_namespace", "noncanonical_url"]},
            "roomId": {"type": "string", "pattern": "^[a-z][a-z0-9_-]{0,63}$"}
          }}
        }
      },
      "ConfigDraft": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Config"
          },
          {
            "type": "object",
            "properties": {
              "rooms": {
                "type": "array",
                "maxItems": 100,
                "items": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Room"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "theme": {
                          "type": "object",
                          "properties": {
                            "templateId": {
                              "const": "calm"
                            }
                          },
                          "required": [
                            "templateId"
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            }
          }
        ]
      },
