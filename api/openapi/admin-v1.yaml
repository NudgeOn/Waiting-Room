        ],
        "requestBody": {"required": true, "description": "Exact JSON, at most 8192 bytes; URL at most 4096 bytes. Invalid URL syntax returns an invalid rule decision without reflecting the input.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteCheckInput"}}}},
        "responses": {
          "200": {"description": "Snapshot route decision, not an admission or HTTP response guarantee.", "headers": {"Cache-Control": {"schema": {"const": "no-store"}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RouteCheckResult"}}}},
          "400": {"description": "Invalid body, method input, media type, duplicate/unknown field or size limit.", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
