              "primary_changed",
              "uncertain_write",
              "state_uncertain",
              "clock_rollback",
              "initialization_uncertainty"
            ]
          },
          "recoveryValidation": {
            "type": "string",
            "description": "Empty when invariants have not failed; otherwise a fixed diagnostic code. Never a raw exception."
          }
