      "put": {
        "operationId": "replaceConfigDraft",
        "summary": "Atomically save a validated draft, replay record and redacted audit",
        "description": "Admin only. 64 KiB strict JSON with all fields including templateId; profile and region immutable. If-Match and document revision must refer to the current saved draft. Per-actor idempotency lasts 24 hours; retries recheck current session and role before replay. This does NOT publish or change live traffic.",
        "tags": ["Administration"],
        "security": [{"adminSession": [], "csrfHeader": []}],
        "x-required-roles": ["Admin"],
        "parameters": [
          {"name": "Origin", "in": "header", "required": true, "schema": {"type": "string", "format": "uri"}, "description": "Exact deployment-pinned HTTPS origin."},
          {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string", "minLength": 43, "maxLength": 43}},
