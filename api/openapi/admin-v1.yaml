                "pattern": "^[A-Za-z0-9_-]{43}$"
              },
              "session": {
                "$ref": "#/components/schemas/CurrentSession"
              }
            },
            "required": [
              "state",
              "session",
              "csrfToken"
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "state": {
                "enum": [
                  "totp_required",
                  "enrollment_required"
                ]
              },
              "challengeToken": {
                "type": "string",
                "minLength": 43,
                "maxLength": 43,
                "pattern": "^[A-Za-z0-9_-]{43}$"
              },
              "expiresAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "state",
              "challengeToken",
              "expiresAt"
            ]
          }
        ]
      },
      "Code": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        },
        "required": [
          "code"
        ]
      },
