        "headers": {
          "Cache-Control": {"schema": {"const": "no-store"}},
          "X-WR-Config-State": {"schema": {"const": "draft-only"}},
          "ETag": {"schema": {"type": "string"}},
          "Idempotency-Replayed": {"schema": {"const": "true"}, "description": "Present for an exact persisted replay."}
        },
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ConfigDraft"}}}
      },
      "ControlProblem": {
        "description": "Redacted validation, permission, revision, capacity or dependency error.",
        "headers": {"Cache-Control": {"schema": {"const": "no-store"}}},
        "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}
      }
    },
    "securitySchemes": {
      "adminSession": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-wrs"
      },
      "csrfHeader": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token"
      },
      "challengeToken": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Scoped one-time challenge; five-minute TTL"
      },
      "bootstrapToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Bootstrap-Token",
        "description": "Loopback installation only. Permanently disabled after bootstrap."
      }
    },
    "schemas": {
      "ConfigDraft": {
        "allOf": [
          {"$ref": "#/components/schemas/Config"},
          {"type": "object", "properties": {"rooms": {"type": "array", "maxItems": 100, "items": {"allOf": [{"$ref": "#/components/schemas/Room"}, {"type": "object", "properties": {"theme": {"type": "object", "properties": {"templateId": {"const": "calm"}}, "required": ["templateId"]}}}]}}}}
        ]
      },
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "NOT_FOUND",
              "IDEMPOTENCY_CONFLICT",
              "ROUTE_CONFLICT",
              "EVENT_OVERLAP",
              "TOTP_ENROLLMENT_REQUIRED",
              "TOTP_INVALID_OR_REPLAYED",
              "TOTP_POLICY_LOCKED",
              "REVISION_MISMATCH",
              "UNSUPPORTED_CAPABILITY",
              "PRECONDITION_REQUIRED",
              "API_RATE_LIMITED",
              "QUEUE_UNAVAILABLE",
              "AUTH_UNAVAILABLE",
              "AUTH_RATE_LIMITED",
              "CONTROL_UNAVAILABLE",
              "COMMAND_CAPACITY_EXCEEDED",
              "INVALID_CONFIG"
            ]
          },
          "requestId": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "code",
          "requestId"
        ]
      },
      "CurrentSession": {
        "type": "object",
        "additionalProperties": false,
        "required": ["userId", "role", "mfaVerified", "totpEnrolled", "capabilityVersion", "capabilities", "createdAt", "lastSeenAt", "idleExpiresAt", "absoluteExpiresAt"],
        "properties": {
          "userId": {"type": "string", "minLength": 1},
          "role": {"enum": ["admin", "operator", "viewer"], "description": "Core capability role IDs, not legacy User display labels."},
          "mfaVerified": {"type": "boolean"},
          "totpEnrolled": {"type": "boolean"},
          "capabilityVersion": {"const": 1},
          "capabilities": {
            "type": "array",
            "items": {
              "type": "object", "additionalProperties": false,
              "required": ["action", "requiresReauthentication"],
              "properties": {
                "action": {"type": "string", "minLength": 1},
                "requiresReauthentication": {"type": "boolean"}
              }
            }
          },
          "createdAt": {"type": "string", "format": "date-time"},
          "lastSeenAt": {"type": "string", "format": "date-time"},
          "idleExpiresAt": {"type": "string", "format": "date-time"},
          "absoluteExpiresAt": {"type": "string", "format": "date-time"}
        }
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "username": {
            "type": "string",
            "minLength": 1
          },
          "role": {
            "enum": [
              "Admin",
              "Operator",
              "Viewer"
            ]
          },
          "active": {
            "type": "boolean"
          },
          "totpEnrolled": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "username",
          "role",
          "active",
          "totpEnrolled"
        ]
      },
      "UserCreate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "minLength": 3,
            "maxLength": 100
          },
          "password": {
            "type": "string",
            "minLength": 12,
            "maxLength": 128,
            "writeOnly": true
          },
          "role": {
            "enum": [
              "Admin",
              "Operator",
              "Viewer"
            ]
          }
        },
        "required": [
          "username",
          "password",
          "role"
        ]
      },
      "UserUpdate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "role": {
            "enum": [
              "Admin",
              "Operator",
              "Viewer"
            ]
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": []
      },
      "Login": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[A-Za-z0-9_-]{1,128}$"
          },
          "password": {
            "type": "string",
            "minLength": 1,
            "writeOnly": true,
            "maxLength": 1024,
            "description": "Exact input, additionally limited to 1024 UTF-8 bytes by the service."
          }
        },
        "required": [
          "username",
          "password"
        ]
      },
      "LoginResult": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "state": {
                "const": "authenticated"
              },
              "csrfToken": {
                "type": "string",
                "minLength": 43,
                "maxLength": 43,
                "pattern": "^[A-Za-z0-9_-]{43}$"
              },
              "session": {
                "$ref": "#/components/schemas/CurrentSession"
              }
            },
            "required": [
              "state",
              "session",
              "csrfToken"
            ]
          },
          {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "state": {
                "enum": [
                  "totp_required",
                  "enrollment_required"
                ]
              },
              "challengeToken": {
                "type": "string",
                "minLength": 43,
                "maxLength": 43,
                "pattern": "^[A-Za-z0-9_-]{43}$"
              },
              "expiresAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "state",
              "challengeToken",
              "expiresAt"
            ]
          }
        ]
      },
      "Code": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        },
        "required": [
          "code"
        ]
      },
      "Recovery": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "recoveryCode": {
            "type": "string",
            "minLength": 43,
            "writeOnly": true,
            "maxLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        },
        "required": [
          "recoveryCode"
        ]
      },
      "Enrollment": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "secret": {
            "type": "string",
            "pattern": "^[A-Z2-7]{32}$",
            "minLength": 32,
            "maxLength": 32,
            "description": "Sensitive manual key; never send to third-party QR services."
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "secret",
          "expiresAt"
        ]
      },
      "EnrollmentResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "state": {
            "const": "authenticated"
          },
          "csrfToken": {
            "type": "string",
            "minLength": 43,
            "maxLength": 43,
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "session": {
            "$ref": "#/components/schemas/CurrentSession"
          },
          "recoveryCodes": {
            "type": "array",
            "minItems": 10,
            "maxItems": 10,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "minLength": 43,
              "maxLength": 43,
              "pattern": "^[A-Za-z0-9_-]{43}$"
            }
          }
        },
        "required": [
          "state",
          "session",
          "csrfToken",
          "recoveryCodes"
        ]
      },
      "ReauthRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "password": {
            "type": "string",
            "minLength": 1,
            "writeOnly": true
          },
          "totp": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          },
          "action": {
            "type": "string",
            "minLength": 1
          },
          "targetId": {
            "type": "string",
            "minLength": 1
          },
          "requestDigest": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          }
        },
        "required": [
          "password",
          "action",
          "targetId",
          "requestDigest"
        ]
      },
      "ReauthResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "reauthToken": {
            "type": "string",
            "minLength": 1
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "reauthToken",
          "expiresAt"
        ]
      },
      "Capabilities": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "supportedPolicies": {
            "type": "array",
            "items": {
              "const": "fifo"
            },
            "minItems": 1,
            "maxItems": 1
          },
          "policySchemaVersion": {
            "const": 1
          },
          "regionMode": {
            "const": "single-region"
          },
          "profile": {
            "enum": [
              "standard-10k",
              "high-scale-100k"
            ]
          }
        },
        "required": [
          "supportedPolicies",
          "policySchemaVersion",
          "regionMode",
          "profile"
        ]
      },
      "Limits": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "maxActiveAdmissionLeases": {
            "type": "integer",
            "minimum": 1,
            "maximum": 100000
          },
          "admissionsPerMinute": {
            "type": "integer",
            "minimum": 1,
            "maximum": 60000
          },
          "admissionTtlSeconds": {
            "type": "integer",
            "minimum": 60,
            "maximum": 3600
          }
        },
        "required": [
          "maxActiveAdmissionLeases",
          "admissionsPerMinute",
          "admissionTtlSeconds"
        ]
      },
      "QueuePolicy": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "const": "fifo"
          },
          "ticketIdleTtlSeconds": {
            "type": "integer",
            "minimum": 60,
            "maximum": 600
          },
          "ticketMaxTtlSeconds": {
            "type": "integer",
            "minimum": 600,
            "maximum": 86400
          },
          "readyTtlSeconds": {
            "type": "integer",
            "minimum": 1,
            "maximum": 120
          }
        },
        "required": [
          "kind",
          "ticketIdleTtlSeconds",
          "ticketMaxTtlSeconds",
          "readyTtlSeconds"
        ]
      },
      "Theme": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "templateId": {
            "type": "string",
            "enum": ["calm"],
            "default": "calm",
            "description": "Trusted built-in template. Room persistence and Backoffice selection are planned, not implemented in the local lab."
          },
          "title": {
            "type": "string",
            "maxLength": 120
          },
          "message": {
            "type": "string",
            "maxLength": 1000
          },
          "primaryColor": {
            "type": "string",
            "pattern": "^#[a-fA-F0-9]{6}$"
          },
          "locale": {
            "enum": [
              "ko",
              "en"
            ]
          },
          "showEstimatedWait": {
            "type": "boolean"
          }
        },
        "required": [
          "title",
          "message",
          "primaryColor",
          "locale",
          "showEstimatedWait"
        ]
      },
      "Room": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "publicId": {
            "type": "string",
            "pattern": "^[a-z2-7]{20}$"
          },
          "name": {
            "type": "string",
            "minLength": 1
          },
          "hostname": {
            "type": "string",
            "minLength": 1
          },
          "origin": {
            "type": "string",
            "format": "uri"
          },
          "healthURL": {
            "type": "string",
            "format": "uri"
          },
          "protectPrefixes": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "excludePrefixes": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1
            }
          },
          "queuePolicy": {
            "$ref": "#/components/schemas/QueuePolicy"
          },
          "limits": {
            "$ref": "#/components/schemas/Limits"
          },
          "theme": {
            "$ref": "#/components/schemas/Theme"
          },
          "active": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "publicId",
          "name",
          "hostname",
          "origin",
          "healthURL",
          "protectPrefixes",
          "excludePrefixes",
          "queuePolicy",
          "limits",
          "theme",
          "active"
        ]
      },
      "Config": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "schemaVersion": {
            "const": 1
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "profile": {
            "enum": [
              "standard-10k",
              "high-scale-100k"
            ]
          },
          "regionId": {
            "type": "string",
            "minLength": 1
          },
          "rooms": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Room"
            }
          }
        },
        "required": [
          "schemaVersion",
          "revision",
          "profile",
          "regionId",
          "rooms"
        ]
      },
      "Validation": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "valid": {
            "type": "boolean"
          },
          "errors": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "path": {
                  "type": "string",
                  "minLength": 1
                },
                "code": {
                  "type": "string",
                  "minLength": 1
                },
                "message": {
                  "type": "string",
                  "minLength": 1
                }
              },
              "required": [
                "path",
                "code",
                "message"
              ]
            }
          }
        },
        "required": [
          "valid",
          "errors"
        ]
      },
      "Runtime": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "mode": {
            "enum": [
              "OFF",
              "AUTO",
              "HOLD",
              "DRAINING",
              "RECOVERY_HOLD"
            ]
          },
          "limits": {
            "$ref": "#/components/schemas/Limits"
          },
          "epoch": {
            "type": "integer",
            "minimum": 1
          },
          "eventState": {
            "enum": [
              "none",
              "scheduled",
              "running",
              "paused_by_override"
            ]
          }
        },
        "required": [
          "revision",
          "mode",
          "limits",
          "epoch",
          "eventState"
        ]
      },
      "RuntimeCommand": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "action": {
            "enum": [
              "auto",
              "hold",
              "safe-drain",
              "instant-off",
              "new-epoch",
              "set-limits"
            ]
          },
          "limits": {
            "$ref": "#/components/schemas/Limits"
          }
        },
        "required": [
          "action"
        ]
      },
      "Event": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "minLength": 1
          },
          "roomId": {
            "type": "string",
            "minLength": 1
          },
          "prequeueAt": {
            "type": "string",
            "format": "date-time"
          },
          "admitAt": {
            "type": "string",
            "format": "date-time"
          },
          "drainAt": {
            "type": "string",
            "format": "date-time"
          },
          "state": {
            "enum": [
              "scheduled",
              "running",
              "paused_by_override",
              "cancelled",
              "completed"
            ]
          }
        },
        "required": [
          "id",
          "roomId",
          "prequeueAt",
          "admitAt",
          "drainAt",
          "state"
        ]
      },
      "EventInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "prequeueAt": {
            "type": "string",
            "format": "date-time"
          },
          "admitAt": {
            "type": "string",
            "format": "date-time"
          },
          "drainAt": {
            "type": "string",
            "format": "date-time"
          }
        },
        "required": [
          "prequeueAt",
          "admitAt",
          "drainAt"
        ]
      },
      "TOTPPolicy": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "mode": {
            "enum": [
              "configurable",
              "forced_on"
            ]
          },
          "enabled": {
            "type": "boolean"
          },
          "authPolicyVersion": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
          "mode",
          "enabled",
          "authPolicyVersion"
        ]
      },
      "TOTPUpdate": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "enabled": {
            "type": "boolean"
          }
        },
        "required": [
          "enabled"
        ]
      },
      "Audit": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "beforeDigest": {"type": "string", "pattern": "^[a-f0-9]{64}$", "description": "SHA-256 of redacted/non-secret configuration, not its contents."},
          "afterDigest": {"type": "string", "pattern": "^[a-f0-9]{64}$"},
          "id": {
            "type": "string",
            "minLength": 1
          },
          "at": {
            "type": "string",
            "format": "date-time"
          },
          "actorId": {
            "type": "string",
            "minLength": 1
          },
          "actorRole": {
            "type": "string",
            "minLength": 1
          },
          "action": {
            "type": "string",
            "minLength": 1
          },
          "targetId": {
            "type": "string",
            "minLength": 1
          },
          "result": {
            "type": "string",
            "minLength": 1
          },
          "requestId": {
            "type": "string",
            "minLength": 1
          },
          "revision": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "id",
          "at",
          "actorId",
          "actorRole",
          "action",
          "targetId",
          "result",
          "requestId",
          "revision"
        ]
      },
      "Ack": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "const": true
          }
        },
        "required": [
          "ok"
        ]
      },
      "Bootstrap": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "minLength": 1,
            "pattern": "^[A-Za-z0-9_-]{1,128}$"
          },
          "password": {
            "type": "string",
            "minLength": 15,
            "maxLength": 1024,
            "writeOnly": true,
            "description": "15 Unicode code points minimum, 1024 UTF-8 bytes maximum. No normalization."
          }
        },
        "required": [
          "username",
          "password"
        ],
        "description": "DB TOTP policy only. Client role, secret and totpEnabled rejected; wizard policy write pending."
      }
    }
  }
}
