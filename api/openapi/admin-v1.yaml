          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "NOT_FOUND",
              "IDEMPOTENCY_CONFLICT",
              "ROUTE_CONFLICT",
              "EVENT_OVERLAP",
              "TOTP_ENROLLMENT_REQUIRED",
              "TOTP_INVALID_OR_REPLAYED",
              "TOTP_POLICY_LOCKED",
              "REVISION_MISMATCH",
              "UNSUPPORTED_CAPABILITY",
              "PRECONDITION_REQUIRED",
              "API_RATE_LIMITED",
              "QUEUE_UNAVAILABLE",
              "AUTH_UNAVAILABLE",
              "AUTH_RATE_LIMITED",
              "CONTROL_UNAVAILABLE",
              "COMMAND_CAPACITY_EXCEEDED",
              "INVALID_CONFIG"
            ]
          },
          "requestId": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "type",
          "title",
          "status",
          "code",
          "requestId"
        ]
      },
