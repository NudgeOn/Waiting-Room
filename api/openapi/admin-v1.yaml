        "operationId": "checkConfigRoute",
        "summary": "Read-only URL rule diagnostic against a saved snapshot; never contacts the target",
        "description": "Does not publish, grant admission, refresh session idle TTL or store the URL in commands/audit. The HTTP POST keeps URL query data out of request paths. Results describe configuration only, not live Gateway application, listener/TLS/DNS/origin availability or HTTP status. Query and port do not affect route matching. Use generation/revision to identify the checked snapshot.",
        "tags": ["Administration"],
        "security": [{"adminSession": [], "csrfHeader": []}],
