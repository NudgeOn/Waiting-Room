          "403": {"description": "Permission, Origin or CSRF rejected.", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
          "405": {"description": "Only POST is supported.", "content": {"application/problem+json": {"schema": {"$ref": "#/components/schemas/Problem"}}}},
