{
  "openapi": "3.1.1",
  "info": {
    "title": "Waiting Room Admin API",
    "version": "0.1.0",
    "description": "Private Admin authentication and persisted configuration draft API with a local Backoffice UI. Draft saves do not publish or activate queue runtime. Local Docker persistence is under development; this is not a production/Beta readiness claim. Pinned Origin required. Bootstrap requires a separate literal-loopback TLS listener. Challenges are not sessions. Other planned operations remain contract-only unless explicitly verified.",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    }
  },
  "servers": [
    {
      "url": "https://admin.waiting.example.test/api/admin/v1",
      "description": "Private admin host"
    }
  ],
  "tags": [
    {
      "name": "Administration",
      "description": "Configuration, operations and security"
    },
    {
      "name": "Authentication",
      "description": "Bootstrap, challenges and sessions"
    }
  ],
  "security": [
    {
      "adminSession": []
    }
  ],
  "paths": {
    "/bootstrap": {
      "post": {
        "operationId": "bootstrap",
        "summary": "Create the first administrator",
