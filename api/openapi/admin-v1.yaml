    "title": "Waiting Room Admin API",
    "version": "0.1.0",
    "description": "Private session-authenticated Admin API for persisted drafts, signed runtime publication, events, account management and TOTP policy. Local Docker implementation is under Beta acceptance testing; this document is not a readiness claim. Explicitly marked planned endpoints are not implemented. Origin pinned; cookie/CSRF required for authenticated mutations.",
    "license": {
      "name": "Apache-2.0",
      "identifier": "Apache-2.0"
    }
  },
  "servers": [
    {
      "url": "https://admin.waiting.example.test/api/admin/v1",
      "description": "Private admin host"
    }
  ],
  "tags": [
    {
      "name": "Administration",
      "description": "Configuration, operations and security"
    },
    {
      "name": "Authentication",
      "description": "Bootstrap, challenges and sessions"
    }
  ],
  "security": [
    {
      "adminSession": []
    }
  ],
