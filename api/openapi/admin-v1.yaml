            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "const": "no-store"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Bootstrap"
              }
            }
          }
        },
        "description": "Local direct TLS adapter: pinned Host and exact Origin, X-WR-Auth: 1, application/json, 4096-byte body cap. No Cookie or X-CSRF-Token; log out before authentication. No CORS or proxy trust. Production listener and UI remain pending. Separate bootstrap handler only; literal loopback HTTPS origin, loopback local socket and peer required. X-Bootstrap-Token only, no Authorization. Operator token issuance is not an HTTP API. DB TOTP policy is authoritative; wizard policy selection pending."
      }
    },
