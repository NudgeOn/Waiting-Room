    "/_wr/v1/rooms/{roomPublicId}/admissions": {
      "post": {
        "operationId": "claimAdmission",
        "summary": "Claim the ticket's one fixed admission",
        "tags": [
          "Queue"
        ],
        "security": [
          {
            "ticketBearer": []
          },
          {
            "queueCookie": []
          }
        ],
        "parameters": [
          {
            "name": "roomPublicId",
            "in": "path",
            "required": true,
            "description": "Opaque Room public ID.",
            "schema": {
              "type": "string",
              "pattern": "^[a-z2-7]{20}$"
            }
          },
          {
            "name": "return",
            "in": "query",
            "description": "Required for browser cookie claims; authenticated same-host return value.",
            "schema": {
              "type": "string",
              "minLength": 1
            }
          }
        ],
        "responses": {
          "200": {
            "description": "App's deterministic admission result. Natural idempotency is the ticket ID.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Admitted"
                }
              }
            }
          },
          "303": {
            "description": "Browser claim sets admission cookie then redirects to the authenticated relative return URL.",
            "headers": {
              "Location": {
                "required": true,
                "schema": {
                  "type": "string",
                  "pattern": "^/(?!/)"
                }
              },
              "Set-Cookie": {
                "required": true,
                "schema": {
                  "type": "string"
                },
                "description": "__Host-wra_{roomPublicId}; Secure; HttpOnly; SameSite=Lax; Path=/"
              },
              "Cache-Control": {
                "schema": {
                  "const": "no-store"
