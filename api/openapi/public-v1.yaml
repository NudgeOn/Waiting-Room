  "components": {
    "securitySchemes": {
      "ticketBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "Opaque 256-bit queue token"
      },
      "queueCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-wrq_{roomPublicId}",
        "description": "Actual cookie name substitutes the route's validated base32 Room ID. Cookie and Bearer are mutually exclusive. Cookie POSTs require same-origin Origin validation."
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status",
          "code",
          "requestId"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "code": {
            "type": "string",
            "enum": [
              "INVALID_REQUEST",
              "UNAUTHENTICATED",
              "FORBIDDEN",
              "NOT_FOUND",
              "IDEMPOTENCY_CONFLICT",
              "TICKET_EXPIRED",
              "WAITING_ROOM_REQUIRED",
              "API_RATE_LIMITED",
              "QUEUE_DRAINING",
              "QUEUE_CAPACITY_EXCEEDED",
              "CONFIG_UNAVAILABLE",
              "QUEUE_UNAVAILABLE"
            ]
          },
          "detail": {
            "type": "string",
            "minLength": 1
          },
          "requestId": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "JoinRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "target"
        ],
        "properties": {
          "target": {
            "type": "string",
            "minLength": 1,
            "maxLength": 2048,
            "pattern": "^/(?!/)",
            "description": "Same-host relative path and optional query. The server additionally rejects ambiguous encoded paths."
          }
        }
      },
      "Pass": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "apiVersion",
          "state"
        ],
        "properties": {
          "apiVersion": {
            "const": "v1"
          },
          "state": {
            "const": "pass"
          }
        }
      },
      "Queued": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "apiVersion",
          "state",
          "roomId",
          "pollAfterMs",
          "expiresAt",
          "statusUrl",
          "heartbeatAfterMs"
        ],
        "properties": {
          "apiVersion": {
            "const": "v1"
          },
          "state": {
            "const": "queued"
          },
          "roomId": {
            "$ref": "#/components/schemas/RoomID"
          },
          "pollAfterMs": {
            "type": "integer",
            "minimum": 3000,
            "maximum": 20000
          },
          "usersAhead": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "estimatedWaitSeconds": {
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "min",
                  "max"
                ],
                "properties": {
                  "min": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "max": {
                    "type": "integer",
                    "minimum": 0
                  }
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "ticketToken": {
            "type": "string",
            "minLength": 1,
            "description": "Only returned to app on join; browsers use HttpOnly cookie."
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "statusUrl": {
            "type": "string",
            "minLength": 1
          },
          "heartbeatAfterMs": {
            "type": "integer",
            "minimum": 1
          },
          "claimUrl": {
            "type": "string",
            "minLength": 1
          }
        }
      },
      "Ready": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "apiVersion",
          "state",
          "roomId",
          "claimUrl",
          "expiresAt"
        ],
        "properties": {
          "apiVersion": {
            "const": "v1"
          },
          "state": {
            "const": "ready"
          },
          "roomId": {
            "$ref": "#/components/schemas/RoomID"
          },
          "claimUrl": {
            "type": "string",
            "minLength": 1
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Admitted": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "apiVersion",
          "state",
          "roomId",
          "admissionToken",
          "expiresAt"
        ],
        "properties": {
          "apiVersion": {
            "const": "v1"
          },
          "state": {
            "const": "admitted"
          },
          "roomId": {
            "$ref": "#/components/schemas/RoomID"
          },
          "admissionToken": {
            "type": "string",
            "minLength": 1
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "RoomID": {
        "type": "string",
        "pattern": "^[a-z2-7]{20}$"
      }
    }
  }
