name: waiting-room-m1
services:
  valkey:
    image: valkey/valkey:8.1.6@sha256:1f84517eca8e0dd9585ed57c572796f32839e1b0e7ce07ad28e6bce098468371
    ports:
      - "127.0.0.1:16379:6379"
    command: ["valkey-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - lab-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
    labels:
      waiting-room.scope: m1-local
volumes:
  lab-valkey:
